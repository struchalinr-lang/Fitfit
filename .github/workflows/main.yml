name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack any ZIP file
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unpacking $z ..."
            unzip -o "$z" -x ".github/*"
          done
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5 and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle-bin.zip
          unzip -q gradle-bin.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrainerLive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true

        
