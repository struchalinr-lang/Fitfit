name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack ZIP and Build APK
        run: |
          python3 -c "import glob, zipfile; [zipfile.ZipFile(z).extractall('.') for z in glob.glob('*.zip')]"
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/g.zip').extractall('/tmp')"
          chmod +x /tmp/gradle-8.5/bin/gradle
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrainerLive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
          
