name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP safely via Python
        run: |
          python3 - << 'PY'
          import glob, zipfile, os
          zips = glob.glob("*.zip") + glob.glob("**/*.zip", recursive=True)
          print("Found ZIP files:", zips)
          for z in zips:
              if "gradle" not in z.lower():
                  print("Extracting:", z)
                  with zipfile.ZipFile(z, 'r') as zf:
                      for member in zf.namelist():
                          if not member.startswith(".github/"):
                              zf.extract(member, ".")
          print("Files in root after unpack:", os.listdir("."))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.5 and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-bin.zip
          python3 -m zipfile -e /tmp/gradle-bin.zip /tmp/
          chmod +x /tmp/gradle-8.5/bin/gradle
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTrainerLive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
